name: Build SvetloeTV Mailer Windows

on:
  push:
    branches: [ "svetloe-mailer-1.0" ]
    paths:
      - "SvetloeTVMailer/src/**"
      - "SvetloeTVMailer/installer/**"
      - ".github/workflows/mailer-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore SvetloeTVMailer\src\SvetloeTV.Mailer\SvetloeTV.Mailer.csproj

      - name: Publish win-x64 self-contained
        shell: pwsh
        run: dotnet publish SvetloeTVMailer\src\SvetloeTV.Mailer\SvetloeTV.Mailer.csproj -c Release -r win-x64 --self-contained true -o SvetloeTVMailer\publish /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None /p:DebugSymbols=false

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: '& "${{ steps.inno.outputs.iscc }}" SvetloeTVMailer\installer\SvetloeTVMailer.iss'

      - name: Smoke-test installer and installed executable
        shell: pwsh
        run: |
          $installer = (Resolve-Path "SvetloeTVMailer\dist\SvetloeTV_Mailer_Setup_1.0.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "SvetloeTVMailerSmoke"
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer returned exit code $($install.ExitCode)" }
          $exe = Join-Path $target "SvetloeTV.Mailer.exe"
          if (-not (Test-Path $exe)) { throw "Installed EXE not found: $exe" }
          $test = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Application self-test returned exit code $($test.ExitCode)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SvetloeTV_Mailer_Setup_1.0
          path: SvetloeTVMailer/dist/SvetloeTV_Mailer_Setup_1.0.exe
          if-no-files-found: error

      - name: Commit installer to build branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SvetloeTVMailer/dist/SvetloeTV_Mailer_Setup_1.0.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Build SvetloeTV Mailer 1.0 installer [skip ci]"
          git push
